<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Timer</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0f">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --border: #2a2a2e;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #c8f135;
      --red: #ff5252;
      --blue: #5b9cf6;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Main screen ── */
    .app {
      width: 100%;
      max-width: 390px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 48px 32px 56px;
    }

    .phase-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      min-height: 16px;
      transition: color 0.3s;
    }
    .phase-label.active   { color: var(--accent); }
    .phase-label.countdown { color: var(--blue); }
    .phase-label.rest     { color: var(--red); }

    /* Ring + centred text */
    .timer-ring {
      position: relative;
      width: 345px;
      height: 345px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .ring-bg  { fill: none; stroke: var(--border); }
    .ring-fill {
      fill: none;
      stroke: var(--accent);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s;
    }
    .ring-fill.countdown { stroke: var(--blue); }
    .ring-fill.rest      { stroke: var(--red); }

    /* Inner content sits inside the ring */
    .timer-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* keep it inside the ring (r=130, stroke=5 → inner diameter ~250px) */
      width: 180px;
      height: 180px;
    }

    /* Time rows */
    .time-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      line-height: 1;
    }

    /* HH, MM, SS each in their own fixed-width span so centering is stable */
    .time-seg {
      font-family: 'DM Mono', monospace;
      font-size: 72px;
      font-weight: 300;
      width: 2ch;
      text-align: center;
      transition: color 0.3s;
    }
    .time-colon {
      font-family: 'DM Mono', monospace;
      font-size: 72px;
      font-weight: 300;
      width: 1ch;
      text-align: center;
      transition: color 0.3s;
      /* nudge colon up slightly to optically centre between cap-height digits */
      margin-bottom: 0.1em;
    }
    /* Tenth-of-second row for count-up */
    .time-tenth {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 300;
      color: var(--muted);
      transition: color 0.3s;
      letter-spacing: 0.02em;
    }

    .time-seg.up, .time-colon.up, .time-tenth.up { color: var(--accent); }
    .time-seg.countdown, .time-colon.countdown    { color: var(--blue); }
    .time-seg.rest, .time-colon.rest              { color: var(--red); }
    .time-seg.idle, .time-colon.idle              { color: var(--muted); }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .btn-main {
      width: 100%;
      height: 64px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-main:active { transform: scale(0.97); opacity: 0.85; }
    .btn-start { background: var(--accent); color: #0e0e0f; }
    .btn-stop  { background: var(--red);    color: #fff; }
    .btn-main:disabled { opacity: 0.25; pointer-events: none; }

    .btn-reset {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0 24px;
      height: 40px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border-radius: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Summary screen ── */
    .summary {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      padding: 56px 32px 48px;
      overflow-y: auto;
      max-width: 390px;
      margin: 0 auto;
    }
    .summary.visible { display: flex; }

    .summary h2 {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 32px;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .summary-table th {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: left;
      padding: 0 0 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
    }
    .summary-table th:not(:first-child),
    .summary-table td:not(:first-child) { text-align: right; }

    .summary-table td {
      padding: 10px 0;
      border-top: 1px solid var(--border);
      color: var(--text);
    }
    .summary-table td.rep-num { color: var(--muted); font-size: 12px; }
    .summary-table td.hung    { color: var(--accent); }
    .summary-table td.rested  { color: var(--red); }

    .summary-total {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-bottom: 40px;
    }
    .summary-total span { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; }
    .summary-total strong { color: var(--accent); }

    .btn-again {
      width: 100%;
      height: 64px;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: #0e0e0f;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>


<div class="summary visible" id="landingScreen">
  <h2>Select mode</h2>
  <button class="btn-again" onclick="startMode('endless')" style="margin-bottom:16px;">Endless</button>
  <button class="btn-again" onclick="startMode('sixminute')">6 Minutes</button>
</div>

<!-- ── Timer screen ── -->
<div class="app" id="appScreen" style="display:none;">
  <div class="phase-label" id="phaseLabel">Ready</div>

  <div class="timer-ring">
    <svg class="ring" width="345" height="345" viewBox="0 0 345 345">
      <circle class="ring-bg"   cx="172.5" cy="172.5" r="155" stroke-width="5"/>
      <circle class="ring-fill" id="ringFill" cx="172.5" cy="172.5" r="155" stroke-width="5"
        stroke-dasharray="974.0" stroke-dashoffset="974.0"/>
    </svg>
    <div class="timer-inner">
      <div class="time-row" id="timeRow">
        <span class="time-seg idle" id="segM">00</span>
        <span class="time-colon idle" id="col1">:</span>
        <span class="time-seg idle" id="segS">00</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-main btn-start" id="mainBtn" onclick="handleMain()">START</button>
    <button class="btn-reset" onclick="handleReset()">reset</button>
  </div>
</div>

<!-- ── Summary screen ── -->
<div class="summary" id="summaryScreen">
  <h2>Session complete</h2>
  <table class="summary-table">
    <thead>
      <tr>
        <th>Rep</th>
        <th>Hung</th>
        <th>Rested</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
  <div class="summary-total">
    <span>Total hang time</span>
    <span><strong id="totalHang">—</strong></span>
  </div>
  <button class="btn-reset" onclick="copyStats()" style="margin-bottom:16px;">Copy</button><button class="btn-again" onclick="handleReset()">Go again</button>
</div>

<script>
  // ── Wake lock ──────────────────────────────────────────────
  let wakeLock = null;
  async function acquireWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('Wake lock acquired');
        wakeLock.addEventListener('release', () => {
          console.log('Wake lock released');
        });
      } catch(e) {
        console.error('Wake lock failed', e);
      }
    } else {
      console.log('Wake Lock API unavailable');
    }
  }
  async function releaseWakeLock() {
    if (wakeLock) { try { await wakeLock.release(); } catch(e){} wakeLock = null; }
  }
  // Re-acquire on tab visibility (iOS releases it on tab switch)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isRunning()) acquireWakeLock();
  });

  // ── State ──────────────────────────────────────────────────
  const STATES = { IDLE:'idle', COUNTDOWN:'countdown', UP:'up', REST:'rest', DONE:'done' };
  let state = STATES.IDLE;
  let elapsed = 0;      // tenths of a second
  let countTarget = 0;
  let restTarget  = 0;
  let interval    = null;

  // Session log: array of { hung: tenths, rested: tenths|null }
  let sessionLog = [];
  let currentHung = 0;
  let totalHangTime = 0;
  let mode = 'endless';

  const CIRC = 2 * Math.PI * 155; // 974.0

  function isRunning() {
    return state !== STATES.IDLE && state !== STATES.DONE;
  }

  // ── DOM refs ───────────────────────────────────────────────
  const phaseLabel  = document.getElementById('phaseLabel');
  const mainBtn     = document.getElementById('mainBtn');
  const ringFill    = document.getElementById('ringFill');
    const segM        = document.getElementById('segM');
  const segS        = document.getElementById('segS');
  const col1        = document.getElementById('col1');
  const appScreen   = document.getElementById('appScreen');
  const summaryScreen = document.getElementById('summaryScreen');
  const landingScreen = document.getElementById('landingScreen');

  // ── Formatting ─────────────────────────────────────────────
  // Takes tenths, returns {h, m, s, t} as zero-padded strings
  function decompose(tenths, ceiling = false) {
    let totalSeconds = ceiling ? Math.ceil(tenths / 10) : Math.floor(tenths / 10);
    return {
      m: Math.floor(totalSeconds / 60).toString().padStart(2,'0'),
      s: (totalSeconds % 60).toString().padStart(2,'0'),
      ms: ((tenths % 10) * 10).toString().padStart(2,'0')
    };
  }

  function setDigits(cls, showTenth) {
    const parts = decompose(elapsed, false);
    segM.textContent = parts.m;
    segS.textContent = parts.s;
    [segM, segS].forEach(el => el.className = 'time-seg ' + cls);
    [col1].forEach(el => el.className = 'time-colon ' + cls);
  }

  function setCountdown(tenths, cls) {
    const parts = decompose(tenths, true);
    segM.textContent = parts.m;
    segS.textContent = parts.s;
    [segM, segS].forEach(el => el.className = 'time-seg ' + cls);
    [col1].forEach(el => el.className = 'time-colon ' + cls);
  }

  function setRing(fraction, type) {
    const offset = CIRC * (1 - Math.max(0, Math.min(1, fraction)));
    ringFill.style.strokeDashoffset = offset;
    ringFill.className = 'ring-fill ' + type;
  }

  // ── Ticker ─────────────────────────────────────────────────
  function tick() {
    elapsed++;
    if (state === STATES.COUNTDOWN) {
      const remaining = countTarget - elapsed;
      setCountdown(remaining, 'countdown');
      setRing(remaining / countTarget, 'countdown');
      if (remaining <= 0) startUp();

    } else if (state === STATES.UP) {
      setDigits('up', true);

    } else if (state === STATES.REST) {
      const remaining = restTarget - elapsed;
      setCountdown(remaining, 'rest');
      setRing(remaining / restTarget, 'rest');
      if (remaining <= 0) startUp();
    }
  }

  // ── Phase transitions ──────────────────────────────────────
  function startCountdown() {
    clearInterval(interval);
    state = STATES.COUNTDOWN;
    countTarget = 100;
    elapsed = 0;
    sessionLog = [];
    currentHung = 0;
    totalHangTime = 0;
    phaseLabel.className = 'phase-label countdown';
    phaseLabel.textContent = 'Get ready';
    setCountdown(100, 'countdown');
    mainBtn.className = 'btn-main btn-stop';
    mainBtn.textContent = 'STOP';
    setRing(1, 'countdown');
    acquireWakeLock();
    interval = setInterval(tick, 100);
  }

  function startUp() {
    clearInterval(interval);
    state = STATES.UP;
    elapsed = 0;
    phaseLabel.className = 'phase-label active';
    phaseLabel.textContent = 'On';
    setDigits('up', true);
    mainBtn.className = 'btn-main btn-stop';
    mainBtn.textContent = 'STOP';
    setRing(1, 'active');
    interval = setInterval(tick, 100);
  }

  function startRest(durationTenths) {
    clearInterval(interval);
    state = STATES.REST;
    restTarget = durationTenths;
    elapsed = 0;
    phaseLabel.className = 'phase-label rest';
    phaseLabel.textContent = 'Rest';
    setCountdown(restTarget, 'rest');
    mainBtn.className = 'btn-main btn-stop';
    mainBtn.textContent = 'STOP';
    setRing(1, 'rest');
    interval = setInterval(tick, 100);
  }

  function finishSession(lastHungTenths) {
    clearInterval(interval);
    releaseWakeLock();
    state = STATES.DONE;
    sessionLog.push({ hung: lastHungTenths, rested: null });
    showSummary();
  }


  function startMode(selectedMode) {
    mode = selectedMode;
    totalHangTime = 0;
    landingScreen.classList.remove('visible');
    appScreen.style.display = '';
    startCountdown();
  }

  function copyStats() {
    let text = `Mode: ${mode}\n\n`;
    let totalHung = 0;

    sessionLog.forEach((rep, i) => {
      totalHung += rep.hung;
      text += `${i + 1}. Hung ${fmtSecs(rep.hung)}`;
      if (rep.rested != null) text += ` | Rested ${fmtSecs(rep.rested)}`;
      text += '\n';
    });

    text += `\nTotal hang time: ${fmtSecs(totalHung)}`;
    navigator.clipboard.writeText(text);
  }


  // ── Button handlers ────────────────────────────────────────
  function handleMain() {
    if (state === STATES.IDLE || state === STATES.DONE) {
      startCountdown();
    } else if (state === STATES.COUNTDOWN) {
      handleReset();
    } else if (state === STATES.UP) {
      const upTenths   = elapsed;
      const halfTenths = Math.round(upTenths / 2);
      currentHung      = upTenths;
      totalHangTime += upTenths;

      if (mode === 'endless' && halfTenths < 100) {
        finishSession(upTenths);
      } else if (mode === 'sixminute' && totalHangTime >= 3600) {
        finishSession(upTenths);
      } else {
        sessionLog.push({ hung: upTenths, rested: halfTenths });
        startRest(halfTenths);
      }
    } else if (state === STATES.REST) {
      handleReset();
    }
  }

  function handleReset() {
    clearInterval(interval);
    releaseWakeLock();
    state = STATES.IDLE;
    elapsed = 0;
    sessionLog = [];
    currentHung = 0;
    totalHangTime = 0;
    phaseLabel.className = 'phase-label';
    phaseLabel.textContent = 'Ready';
    segM.textContent = '00'; segS.textContent = '00';
    [segM,segS].forEach(el => el.className = 'time-seg idle');
    [col1].forEach(el => el.className = 'time-colon idle');
    
    mainBtn.className = 'btn-main btn-start';
    mainBtn.textContent = 'START';
    setRing(0, '');
    appScreen.style.display = '';
    summaryScreen.classList.remove('visible');
    landingScreen.classList.add('visible');
    appScreen.style.display = 'none';
  }

  // ── Summary ────────────────────────────────────────────────
  function fmtSecs(tenths) {
    const total = tenths / 10;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = (total % 60).toFixed(1);
    if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.padStart(4,'0')}`;
    if (m > 0) return `${m}:${s.padStart(4,'0')}`;
    return `${s}s`;
  }

  function showSummary() {
    const tbody = document.getElementById('summaryBody');
    tbody.innerHTML = '';
    let totalHung = 0;

    sessionLog.forEach((rep, i) => {
      totalHung += rep.hung;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="rep-num">${i + 1}</td>
        <td class="hung">${fmtSecs(rep.hung)}</td>
        <td class="rested">${rep.rested != null ? fmtSecs(rep.rested) : '—'}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('totalHang').textContent = fmtSecs(totalHung);

    appScreen.style.display = 'none';
    summaryScreen.classList.add('visible');

    // reset main state for "Go again"
    mainBtn.className = 'btn-main btn-start';
    mainBtn.textContent = 'START';
    phaseLabel.className = 'phase-label';
    phaseLabel.textContent = 'Ready';
  }
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
</html>
